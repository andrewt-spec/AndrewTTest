<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listening and responding supportively</title>
<style>
:root{
  --blue:#004d8c;
  --grey:#4d4f53;
  --white:#ffffff;
  --tint:#eaf1f8;
  --line:#c9d5e2;
  --ok:#1b6e35;
  --ok-bg:#e6f3ea;
  --bad:#a52a1f;
  --bad-bg:#fbeceb;
  --head:"Arial Narrow","Roboto Condensed","Helvetica Neue Condensed","Franklin Gothic Medium",Arial,sans-serif;
  --body:Arial,"Helvetica Neue",Helvetica,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--white);color:var(--grey);font:16px/1.55 var(--body)}
.shell{max-width:1000px;margin:0 auto;padding:28px 24px 48px}
#app:focus{outline:none}
h1,h2,h3{margin:0}
h1,.h-display{font-family:var(--head);font-weight:800;text-transform:uppercase;letter-spacing:.01em;color:var(--blue);line-height:1.1}
h1{font-size:clamp(1.6rem,4.2vw,2.3rem)}
h2{font-family:var(--head);font-weight:800;color:var(--blue);font-size:clamp(1.3rem,3vw,1.65rem);line-height:1.2}
h1:focus,h2:focus{outline:none}
p{margin:0 0 .8em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.on-blue :focus-visible,.btn:focus-visible{outline-color:var(--blue)}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Hub ---------- */
.hub-head{display:flex;gap:18px;align-items:center;margin-bottom:22px}
.hub-icon{flex:0 0 68px;height:68px;border-radius:50%;background:var(--blue);display:grid;place-items:center}
.hub-sub{font-weight:700;color:var(--grey);margin:.5em 0 .15em}
.hub-hint{margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.card{position:relative;display:flex;text-align:left;padding:0;background:var(--white);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:150px;transition:box-shadow .15s,border-color .15s}
.card:hover{border-color:var(--blue);box-shadow:0 4px 14px rgba(0,77,140,.18)}
.card-photo{flex:0 0 38%;max-width:132px;background:var(--tint);display:grid;place-items:center}
.card-photo img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
.av{display:grid;place-items:center;border-radius:50%;color:var(--white);font-family:var(--head);font-weight:800;letter-spacing:.02em}
.av-0{background:var(--blue)}
.av-1{background:var(--grey)}
.card .av{width:76px;height:76px;font-size:1.7rem}
.card-body{flex:1;padding:12px 44px 12px 14px;display:flex;flex-direction:column;gap:3px}
.card-name{font-family:var(--head);font-weight:800;font-size:1.25rem;color:var(--blue);text-transform:uppercase;line-height:1.1}
.card-role{font-weight:700;font-size:.85rem;color:var(--grey)}
.card-where{display:flex;align-items:center;gap:5px;font-size:.85rem;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:4px}
.card-quote{font-size:.88rem;line-height:1.4;color:var(--grey)}
.card-quote b{color:var(--blue);font-size:1.3em;line-height:0;vertical-align:-.15em;margin-right:3px}
.card-go{position:absolute;right:10px;bottom:10px;width:26px;height:26px;border-radius:50%;border:2px solid var(--blue);display:grid;place-items:center}
.card.done{border-color:var(--blue)}
.badge-done{position:absolute;top:8px;right:8px;background:var(--blue);color:var(--white);font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;display:flex;gap:4px;align-items:center}
.info{display:flex;gap:12px;align-items:center;background:var(--tint);border-radius:8px;padding:12px 16px;margin-top:18px;font-size:.92rem}
.info-i{flex:0 0 30px;height:30px;border-radius:50%;background:var(--blue);color:var(--white);display:grid;place-items:center;font-weight:700;font-family:Georgia,serif}
.hub-foot{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between;margin-top:22px}
.tally{font-weight:700;color:var(--blue)}
.tally small{display:block;font-weight:400;color:var(--grey)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--blue);color:var(--white);border:2px solid var(--blue);border-radius:99px;padding:10px 26px;font-weight:700;letter-spacing:.02em}
.btn:hover{background:var(--grey);border-color:var(--grey)}
.btn[disabled]{background:#c8ccd2;border-color:#c8ccd2;color:#5c5f64;cursor:not-allowed}
.btn.alt{background:var(--white);color:var(--blue)}
.btn.alt:hover{background:var(--tint)}
.link{background:none;border:0;padding:4px 0;color:var(--blue);font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* ---------- Scene screens ---------- */
.topbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;margin-bottom:18px}
.who{display:flex;gap:12px;align-items:center}
.who .av,.who img{width:46px;height:46px;font-size:1.05rem;border-radius:50%;object-fit:cover;object-position:50% 25%}
.who-name{font-family:var(--head);font-weight:800;font-size:1.15rem;color:var(--blue);text-transform:uppercase;line-height:1.1}
.who-meta{font-size:.85rem}
.steps{display:flex;align-items:center;gap:8px;font-size:.85rem;font-weight:700;color:var(--blue);margin-bottom:14px}
.dots{display:flex;gap:5px}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--blue)}
.dot.on{background:var(--blue)}
.remember{border-left:4px solid var(--grey);background:var(--tint);padding:10px 14px;margin-bottom:16px;font-size:.92rem;border-radius:0 6px 6px 0}
.scene{background:var(--blue);color:var(--white);border-radius:10px;padding:22px 26px;margin-bottom:22px}
.scene .narr{font-style:italic;margin-bottom:.6em;opacity:.95}
.scene .quote{margin:0;font-size:clamp(1.15rem,2.6vw,1.45rem);line-height:1.4;font-weight:700}
.scene .quote::before{content:"“"}
.scene .quote::after{content:"”"}
.recap{background:var(--tint);border-radius:10px;padding:18px 22px;margin-bottom:22px}
.recap h2{margin-bottom:.4em}
.prompt{margin:0 0 12px}
.opts{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:var(--white);border:2px solid var(--line);border-radius:10px;padding:12px 16px;color:var(--grey)}
.opt:hover:not([disabled]){border-color:var(--blue);background:var(--tint)}
.letter{flex:0 0 30px;height:30px;border-radius:50%;background:var(--blue);color:var(--white);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.opt-txt{flex:1;padding-top:3px}
.opt-tag{display:block;font-size:.8rem;font-weight:700;margin-top:3px}
.opt.good{border-color:var(--ok);background:var(--ok-bg)}
.opt.good .letter{background:var(--ok)}
.opt.good .opt-tag{color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .letter{background:var(--bad)}
.opt.bad .opt-tag{color:var(--bad)}
.opt[disabled]{cursor:default}
.opt.faded{opacity:.62}
.fb{margin-top:16px;border-radius:10px;padding:16px 20px;border:2px solid var(--blue);background:var(--white)}
.fb:focus{outline:none}
.fb h3{font-family:var(--head);font-size:1.15rem;font-weight:800;color:var(--blue);margin-bottom:.35em}
.fb.good h3{color:var(--ok)}
.fb.bad h3{color:var(--bad)}
.fb p:last-of-type{margin-bottom:0}
.fb .actions{margin-top:14px}
.kl{background:var(--white);border:2px solid var(--blue);border-radius:10px;padding:20px 24px}
.kl h2{margin-bottom:.4em}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.page-actions{margin-top:22px}

/* ---------- Quiz ---------- */
fieldset{border:0;margin:0;padding:0;min-inline-size:0}
legend{padding:0;margin-bottom:12px;font-weight:700;color:var(--blue)}
.chk{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);border-radius:10px;padding:11px 14px;cursor:pointer;background:var(--white)}
.chk:hover{border-color:var(--blue)}
.chk input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--blue);flex:0 0 auto}
.chk.good{border-color:var(--ok);background:var(--ok-bg)}
.chk.bad{border-color:var(--bad);background:var(--bad-bg)}
.chk.miss{border-color:var(--grey);border-style:dashed}
.chk .tag{display:block;font-size:.8rem;font-weight:700}
.chk.good .tag{color:var(--ok)}
.chk.bad .tag{color:var(--bad)}
.panel{background:var(--blue);color:var(--white);border-radius:10px;padding:22px 26px}
.panel h2{color:var(--white);margin-bottom:.5em}
.panel p:last-child{margin-bottom:0}
.panel .btn{background:var(--white);color:var(--blue);border-color:var(--white)}
.panel .btn:hover{background:var(--tint)}
.panel :focus-visible{outline-color:var(--white)}

@media (max-width:560px){
  .shell{padding:18px 14px 36px}
  .hub-icon{flex-basis:52px;height:52px}
  .scene{padding:18px}
  .card-photo{flex-basis:30%}
  .card .av{width:58px;height:58px;font-size:1.3rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="shell">
  <main id="app" tabindex="-1"></main>
  <div id="live" class="sr" aria-live="polite"></div>
</div>

<script>
(function(){
'use strict';

/* =====================================================================
   CONFIG – change these without touching the rest of the code
   ===================================================================== */
var CONFIG = {
  MIN_BRANCHES: 3,          // conversations that must be completed before the learner can continue
  REQUIRED_IDS: [],         // optional: ids that MUST be completed, e.g. ['sofia','kwame']
  REPORT_SCORE: false,      // true = send first-attempt accuracy to the LMS as the score
  SHOW_LEARNER_MESSAGE_WHEN_NO_LMS: false
};

/* =====================================================================
   CONTENT – all learner-facing text lives below this line.
   Text is written as in the script; {scriptName} is swapped for the
   display name (see CHARS) so a name change is a one-line edit.
   ===================================================================== */
var CHARS = [
  {id:'nuno',  scriptName:'Nuno',    name:'Nuno',   age:19, role:'Player',           country:'Brazil',  tone:0, photo:'',
   quote:'I don’t really know what’s wrong. I just haven’t been feeling myself lately.'},
  {id:'sofia', scriptName:'Sofia',   name:'Sofia',  age:27, role:'Coach',            country:'England', tone:1, photo:'',
   quote:'I’m exhausted all the time and am finding it hard to switch off.'},
  {id:'c3',    scriptName:'Shanice', name:'Mariam', age:15, role:'Academy Player',   country:'Morocco', tone:0, photo:'',
   quote:'Everything feels like a lot at the moment.'},
  {id:'kwame', scriptName:'Kwame',   name:'Kwame',  age:32, role:'Referee',          country:'Ghana',   tone:1, photo:'',
   quote:'Things have changed recently and I’m finding that really difficult.'},
  {id:'yuki',  scriptName:'Yuki',    name:'Yuki',   age:41, role:'Team Manager',     country:'Japan',   tone:0, photo:'',
   quote:'I’ve been worried about someone close to me.'},
  {id:'ratu',  scriptName:'Ratu',    name:'Ratu',   age:30, role:'Club Welfare Officer', country:'Fiji', tone:1, photo:'',
   quote:'I’m not sure what I need right now.'}
];

var TEXT = {
  title: 'Listening and responding supportively',
  hubSub: 'You have checked in with somebody and they would like to talk.',
  hubHint: 'Click on a person to see what they might share.',
  hubInfo: 'Every conversation is unique. People may share many different things, and support will look different for each person.',
  remember: 'Remember: We do not yet know where any of these conversations will lead. Our role is not to work out what is wrong or decide what support someone needs.'
};

/* opts: [text, isCorrect, "what happens" text (retry mode only)] */
var BRANCHES = {

nuno: [
 {type:'q', narr:'After training, Nuno hangs back to speak to you. He says:',
  quote:'I don’t really know what’s wrong. I just haven’t been feeling myself lately.',
  prompt:'What do you say?',
  opts:[
   ['“Do you think you might be depressed?”',0],
   ['“That’s OK, you don’t need to have it all worked out. What have things been like?”',1],
   ['“Has it got anything to do with you having been promoted to the first team?”',0],
   ['“Everyone feels like that sometimes. It’ll pass.”',0]],
  fb:'Nuno has told you that he does not know what is wrong. Asking him to name what is going on, guessing a cause or accepting that it is normal all close the conversation. In contrast, inviting him to describe the issue keeps the conversation open. Answer A hands a 19-year-old a diagnosis from someone who is unqualified to give one.'},
 {type:'q',
  quote:'I don’t know. I’ve just been feeling flat. Training has been fine. I just don’t really feel like doing anything after training.',
  prompt:'What now?',
  opts:[
   ['Ask what has changed and when he first noticed the change.',1],
   ['Suggest that he see the club doctor.',0],
   ['Reassure him that it sounds like normal tiredness.',0],
   ['Ask whether he is sleeping and eating properly.',0]],
  fb:'The fact that Nuno described himself as feeling “flat” and has been withdrawing from activities that he used to do is worth understanding better before you take things any further. Answer B may come in time, but it is not appropriate 30 seconds into the conversation. Answer C settles the question before it has been asked: Nuno has described a change, and calling it normal tiredness invites him to leave it there. Answer D turns you into an assessor.'},
 {type:'kl',
  quote:'Around a few weeks ago. It’s been going on since about February.',
  kl:['You did not find out what was wrong, and you did not need to. You established that something had changed, roughly when and that it is an ongoing issue. That is enough to keep the conversation open and enable you to check in at a later date. If the issue is still there when you check in, encourage Nuno to see a doctor or direct him towards your medical route. If he would like additional support, you can help him to think about what might be useful, and you would agree with him about what gets passed on and to whom.']}
],

sofia: [
 {type:'q',
  quote:'I’m exhausted all the time and am finding it hard to switch off.',
  prompt:'What do you say?',
  opts:[
   ['“You should take a few days off.”',0],
   ['“That sounds draining. How long have things been like that?”',1],
   ['“It’s a demanding job. That’s part and parcel of the role.”',0],
   ['“Have you tried getting to bed earlier?”',0]],
  fb:'Answer C treats the issue as simply part of the job and closes the conversation. Answers A and D offer solutions before you know the problem, and for a coach on a short-term contract, suggesting that they take time off can sound like you think that they are not coping.'},
 {type:'q',
  quote:'A while. I don’t want this going any further, to be honest. My contract is up in June.',
  prompt:'What do you say?',
  opts:[
   ['“Don’t worry, nobody will hear about this.”',0],
   ['“That makes sense. This stays between us unless anything you say raises a safety concern, in which case, I’d have to get help, and I’d tell you that I was going to do so first.”',1],
   ['“You shouldn’t have to worry about that.”',0],
   ['“I’d have to mention it to the director of football.”',0]],
  fb:'Sofia’s fears about her future are realistic and the reason why many people in football say nothing. Answer C dismisses the issue. Answer A features a promise that you may not be able to keep. Answer D escalates a well-being conversation into a formal one. Making the confidentiality limitations clear from the outset enables the rest of the conversation to take place.'},
 {type:'kl',
  quote:'OK, thanks.',
  kl:['People weigh up what disclosure might cost them. For staff on insecure contracts, that calculation is real. You cannot remove the risk but being honest about confidentiality at an early stage enables someone to keep talking. Say what you can and cannot keep to yourself and do so in your own words. A safety concern is the most common reason you may have to pass something on, and it is not the only one: safeguarding duties and your organisation’s legal and reporting responsibilities may also require you to share information. Find out what applies to you before you need to know. The 2026 IOC consensus statement lists fear of deselection and concern about losing sporting opportunities among the main barriers to seeking help. Sofia’s calculation is not unusual or irrational.']}
],

c3: [
 {type:'q', narr:'After a training session, Shanice quietly tells you:',
  quote:'Everything feels like a lot at the moment.',
  prompt:'What is the first thing to do?',
  opts:[
   ['Ask Shanice what has been going on.',0],
   ['Move somewhere private and quiet to allow Shanice to speak freely.',0],
   ['Before Shanice goes any further, let her know that, depending on what she tells you, you may not be able to keep things to yourself.',1],
   ['Reassure Shanice that whatever she says is safe with you.',0]],
  fb:'Shanice is 15. If she tells you something that raises a safeguarding concern, you will have to pass it on, and she deserves to know that before, and not after, she decides what to say. Answer A is the right question in the wrong order: it invites Shanice to tell you something before she knows what you may have to do with it. As for answer B, a private space is not the same as an isolated space, and you should not be alone with a child behind a closed door. In some settings, an adult of the opposite sex speaking alone with a 15-year-old is an issue in itself, however well intended. In that scenario, the solution involves another adult being present or another adult having the conversation, rather than no conversation taking place at all. Answer D is the most damaging option, because it promises her something that you may not be able to deliver.'},
 {type:'q',
  narr:'You say: “Before you tell me anything else, I should say that because you’re under 18, if something worries me about your safety, I won’t be able to keep it between the two of us. I’d always tell you what I was doing.”',
  quote:'OK. It’s just school, football and everything at home. It’s a lot.',
  prompt:'What now?',
  opts:[
   ['Ask specifically what is happening at home.',0],
   ['Ask Shanice which part is weighing most heavily on her.',1],
   ['Tell Shanice that you will speak to her parents.',0],
   ['Reassure Shanice that lots of academy players feel this way.',0]],
  fb:'Shanice named three things that are troubling her. Letting her choose which is weighing most heavily on her means that she remains in charge of her own situation. Answer A presses her on the area that you are most curious about, which might not be the one that she needs to talk about. Answer C removes her agency, and you do not yet know whether the problem lies at home. Answer D tells Shanice that what she has described is unremarkable, which gives her a reason to stop describing it.'},
 {type:'kl',
  quote:'Probably school. There’s exams, and I’m training four nights a week.',
  kl:['When you are speaking with a child or young person, be clear about the limits of confidentiality before, and not after, they speak to you. Making the confidentiality limitations clear from the outset can feel awkward, but it protects the relationship. If Shanice had gone on to talk about something that needed to be reported, it is important that she would have known what would have happened next.']}
],

kwame: [
 {type:'q',
  quote:'Things have changed recently, and I’m finding that really difficult.',
  prompt:'What do you say?',
  opts:[
   ['“What’s changed?”',1],
   ['“Is it the abuse? It’s got worse this season.”',0],
   ['“Refereeing is difficult. You have to be able to take the flak.”',0],
   ['“Have you spoken to your regional officer?”',0]],
  fb:'Kwame offered you a door; walk through it rather than guessing what is behind it. Answer B guesses at abuse, and a plausible guess is harder to correct than an implausible one. Answer C is the very message that discourages officials from speaking up. Answer D moves to a referral before you know what has changed.'},
 {type:'q',
  quote:'I’ve moved regions for work. I don’t really know anyone at my games now. I drive there, I referee, I drive home.',
  prompt:'What is the most useful response?',
  opts:[
   ['Tell Kwame that he will settle in over time.',0],
   ['Ask Kwame whether he is still in contact with people in the region where he used to referee and whether anything would help him to feel less lonely at matches.',1],
   ['Suggest that he join a local gym.',0],
   ['Offer to be his main point of contact in the region.',0]],
  fb:'Kwame’s issue is isolation, which can be an issue in officiating: he works alongside colleagues he may not know, travels to the fixture and travels home, and he has no squad or staff team around him between matches. Asking what would help enables him to remain in control of the situation. Answer A asks Kwame to wait, which leaves him in the same situation. Answer C sends him to a gym, where he would also be on his own. Although answer D is generous, it makes you the whole support structure, which is not sustainable and is not the goal.'},
 {type:'kl',
  quote:'I still speak to two of the lads from my old region. I hadn’t thought about calling them.',
  kl:['Match officials often do not have the standing structures that players and coaches have around them. Sometimes, the most useful thing you can do is to remind someone of a connection that they already have.']}
],

yuki: [
 {type:'q',
  quote:'I’ve been worried about someone close to me.',
  prompt:'What do you say?',
  opts:[
   ['“Who is it?”',0],
   ['“Is it someone at the club?”',0],
   ['“That sounds hard. Do you want to tell me about it?”',1],
   ['“Have they got support?”',0]],
  fb:'Answers A and B ask Yuki to reveal the identity of/information about the person who has been concerning him before you know whether that matters. Let him decide how much to share. Answer D enquires about whether the other person is receiving support before Yuki has said anything about the support he is receiving.'},
 {type:'q',
  quote:'It’s my brother. He’s been unwell for a long time. I’m the one who deals with these things.',
  prompt:'What is the most important thing to do next?',
  opts:[
   ['Advise Yuki on how to support his brother.',0],
   ['Ask Yuki how he himself is doing.',1],
   ['Suggest that his brother contact a professional.',0],
   ['Offer to look into services that Yuki could pass on to his brother.',0]],
  fb:'Yuki is the person in front of you. Carrying long-term concern for someone else can be exhausting, and people in that position are often not asked how they are doing themselves. Answers A, C and D all keep the focus on Yuki’s brother, who is not your responsibility and is not the person in front of you.'},
 {type:'kl',
  quote:'Me? I hadn’t really thought about it. Tired, I suppose.',
  kl:['When someone discloses a concern about another person, they are also telling you something about themselves. Support the person in front of you.']}
],

ratu: [
 {type:'q',
  quote:'I’m not sure what I need right now.',
  prompt:'What do you say?',
  opts:[
   ['“That’s alright. Do you want to just talk it through?”',1],
   ['“You’re the welfare officer, you know better than me!”',0],
   ['“Well, what’s brought this on?”',0],
   ['“Shall I find someone for you to speak to?”',0]],
  fb:'Answer B is said in good spirit, but it closes the door to a conversation completely, because it tells Ratu that he should be handling the issue himself. People in helping roles are often met with exactly that response, which can make it harder for them to speak about their struggles. Answer C asks Ratu to account for himself when he has just said that he does not know what he needs. Answer D passes him on at a time when he has chosen to speak to you.'},
 {type:'q',
  quote:'I’ve had three difficult cases this season. I keep thinking about one of them. I don’t want to make it about me.',
  prompt:'What do you say?',
  opts:[
   ['“You need to switch off from work more.”',0],
   ['“It’s not making it about you. Supporting people affects those doing the supporting. That’s normal, and it’s worth taking seriously.”',1],
   ['“Have you had a debrief?”',0],
   ['“You can’t take these things home with you.”',0]],
  fb:'Ratu has expressed his desire not to make things about him before describing the issue. Telling him that it is normal for people who support others to be affected is the right thing to say. Answers A and D are instructions that he already knows and cannot follow. Answer C poses a fair question but one that should be asked after you have told Ratu that his reaction is legitimate, rather than instead of doing so.'},
 {type:'kl',
  quote:'I suppose I’ve not spoken to anyone about it.',
  kl:['Welfare officers, safeguarding leads and medical staff absorb other people’s distress repeatedly and are among the least likely individuals to be asked how they are. Supporting a helper is part of MHFR too. The 2026 IOC consensus statement makes the same point: mental health symptoms are experienced not only by athletes but by coaches, medical and performance staff, and others in non-clinical roles.']}
]
};

var QUIZ = {
  title: 'What stayed the same?',
  intro: 'Despite the fact that the exercise featured six people and as many conversations, some things were common to all of them.',
  q: 'Which of the following guidance may apply when providing an appropriate, supportive MHFR?',
  hint: 'Select all of the answers that apply.',

function charById(id){ for(var i=0;i<CHARS.length;i++) if(CHARS[i].id===id) return CHARS[i]; return null; }
function t(s){
  if(!s) return '';
  CHARS.forEach(function(c){ if(c.scriptName!==c.name) s=s.split(c.scriptName).join(c.name); });
  return s;
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function T(s){ return esc(t(s)); }
function letter(i){ return String.fromCharCode(65+i); }

function save(){
  var key = route.stage==='c' ? route.k : (route.stage==='b' ? 'hub' : route.stage);
  Scorm.setData(JSON.stringify({s:key, d:S.done, f:S.first, c:S.complete?1:0}));
  Scorm.setBookmark(route.stage+(route.k?':'+route.k:''));
}
function load(){
  var raw = Scorm.getData();
  if(!raw) return;
  try{
    var o = JSON.parse(raw);
    S.done = o.d||[]; S.first = o.f||{}; S.complete = !!o.c;
    var s = o.s;
    if(s==='c1'||s==='c2') route={stage:'c',k:s,i:0};
    else if(s==='quiz'||s==='fb'||s==='next'||s==='end'||s==='hub') route={stage:s};
  }catch(e){}
}
function scorePct(){
  var k=Object.keys(S.first); if(!k.length) return 0;
  var n=0; k.forEach(function(x){ n+=S.first[x]?1:0; });
  return Math.round(100*n/k.length);
}

var ICON_HUB='<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="2.5" width="8" height="6" rx="1.5"/><circle cx="12" cy="13" r="2"/><path d="M8.5 20c0-2 1.6-3.5 3.5-3.5s3.5 1.5 3.5 3.5"/><circle cx="5.5" cy="14.5" r="1.5"/><circle cx="18.5" cy="14.5" r="1.5"/></svg>';

function setView(html, focusSel){
  app.innerHTML = html;
  window.scrollTo(0,0);
  var f = app.querySelector(focusSel||'[data-focus]');
  if(f){ f.setAttribute('tabindex','-1'); try{ f.focus({preventScroll:true}); }catch(e){ f.focus(); } }
}

function who(c, rightHTML){
  return '<div class="topbar"><div class="who">'+avatar(c)+
    '<div><div class="who-name">'+esc(c.name)+', '+c.age+'</div><div class="who-meta">'+esc(c.role)+' · '+esc(c.country)+'</div></div></div>'+
    (rightHTML||'')+'</div>';
}
function stepsHTML(i,n,label){
  var d=''; for(var k=0;k<n;k++) d+='<span class="dot'+(k<=i?' on':'')+'"></span>';
  return '<div class="steps"><span>'+esc(label)+'</span><span class="dots" aria-hidden="true">'+d+'</span></div>';
}

/* ---- Hub ---- */
function minMet(){
  if(S.done.length < CONFIG.MIN_BRANCHES) return false;
  for(var i=0;i<CONFIG.REQUIRED_IDS.length;i++) if(S.done.indexOf(CONFIG.REQUIRED_IDS[i])<0) return false;
  return true;
}
function renderHub(){
  var cards = CHARS.map(function(c){
    var done = S.done.indexOf(c.id)>=0;
    return '<button class="card'+(done?' done':'')+'" data-action="open" data-id="'+c.id+'" aria-label="'+esc(c.name)+', '+c.age+', '+esc(c.role)+', '+esc(c.country)+'. '+(done?'Completed. Open again.':'Open this conversation.')+'">'+
      '<span class="card-photo">'+avatar(c)+'</span>'+
      '<span class="card-body">'+
        '<span class="card-name">'+esc(c.name)+', '+c.age+'</span>'+
        '<span class="card-role">'+esc(c.role)+'</span>'+
        '<span class="card-where">'+ICON_PIN+esc(c.country)+'</span>'+
        '<span class="card-quote"><b aria-hidden="true">“</b>'+esc(c.quote)+'</span>'+
      '</span>'+
      (done?'<span class="badge-done">'+ICON_TICK+'Done</span>':'')+
      '<span class="card-go" aria-hidden="true">'+ICON_GO+'</span>'+
    '</button>';
  }).join('');
  var need = Math.max(0, CONFIG.MIN_BRANCHES - S.done.length);
  var reqNote='';
  if(CONFIG.REQUIRED_IDS.length){
    var miss = CONFIG.REQUIRED_IDS.filter(function(id){return S.done.indexOf(id)<0}).map(function(id){return charById(id).name});
    if(miss.length) reqNote=' You must also complete: '+miss.join(', ')+'.';
  }
  var tally = minMet()
    ? '<div class="tally">'+S.done.length+' of '+CHARS.length+' conversations completed<small>You can continue now, or explore more of the conversations first.</small></div>'
    : '<div class="tally">'+S.done.length+' of '+CHARS.length+' conversations completed<small>Complete at least '+CONFIG.MIN_BRANCHES+' to continue. Exploring more than one lets you compare them.'+reqNote+'</small></div>';
  setView(
    '<div class="hub-head"><div class="hub-icon">'+ICON_HUB+'</div><div>'+
      '<h1 class="sr" data-focus>'+esc(TEXT.title)+'</h1>'+
      '<p class="hub-sub" style="margin-top:0">'+esc(TEXT.hubSub)+'</p>'+
      '<p class="hub-hint">'+esc(TEXT.hubHint)+'</p></div></div>'+
    '<div class="grid">'+cards+'</div>'+
    '<div class="info"><span class="info-i" aria-hidden="true">i</span><span>'+esc(TEXT.hubInfo)+'</span></div>'+
    '<div class="hub-foot">'+tally+'<button class="btn" data-action="toquiz"'+(minMet()?'':' disabled')+'>Continue</button></div>'
  );
}

/* ---- Decision block (shared by branches and continuations) ---- */
function decisionInner(){
  var s=dec.screen, mode=dec.mode, h='';
  h += '<h2 class="prompt" id="prompt">'+T(s.prompt)+'</h2><ul class="opts" aria-labelledby="prompt">';
  s.opts.forEach(function(o,i){
    var cls='opt', tag='', disabled='';
    var tried = dec.tried.indexOf(i)>=0;
    if(dec.solved){
      disabled=' disabled';
      if(o[1]){ cls+=' good'; tag = (dec.pick===i || mode==='cq') ? 'Best response' : 'Best response'; }
      else if(dec.pick===i){ cls+=' bad'; tag='Your choice: not the best response'; }
      else cls+=' faded';
    } else if(tried){
      cls+=' bad'; disabled=' disabled'; tag='Tried: not the best response';
    }
    h += '<li><button class="'+cls+'" data-action="pick" data-i="'+i+'"'+disabled+' aria-pressed="'+((dec.pick===i||tried)?'true':'false')+'">'+
      '<span class="letter" aria-hidden="true">'+letter(i)+'</span>'+
      '<span class="opt-txt"><span class="sr">Option '+letter(i)+': </span>'+T(o[0])+(tag?'<span class="opt-tag">'+tag+'</span>':'')+'</span></button></li>';
  });
  h += '</ul>';
  if(dec.msg){
    var m=dec.msg;
    h += '<div class="fb '+m.kind+'" id="fb" tabindex="-1" role="status"><h3>'+esc(m.title)+'</h3>'+
      (m.body?'<p>'+T(m.body)+'</p>':'')+
      (m.kind==='bad' && mode==='cq' ? '<div class="actions"><button class="btn" data-action="retry">Go back and choose again</button></div>' : '')+
      '</div>';
  }
  if(dec.solved){
    h += '<div class="actions page-actions"><button class="btn" data-action="next" id="cont">Continue</button></div>';
  }
  return h;
}
function refreshDecision(focusFb){
  var box=document.getElementById('dec');
  box.innerHTML=decisionInner();
  var f = focusFb ? document.getElementById('fb') : null;
  if(f){ f.focus({preventScroll:true}); f.scrollIntoView({block:'nearest',behavior:'smooth'}); }
}
function sceneHTML(s){
  if(!s.narr && !s.quote) return '';
  return '<div class="scene on-blue">'+
    (s.narr?'<p class="narr">'+T(s.narr)+'</p>':'')+
    (s.quote?'<blockquote class="quote">'+T(s.quote)+'</blockquote>':'')+'</div>';
}
function klHTML(paras){
  return '<div class="kl"><h2>Key learning</h2>'+paras.map(function(p){return '<p>'+T(p)+'</p>';}).join('')+'</div>';
}

/* ---- Branch screens ---- */
function renderBranch(){
  var c=charById(route.id), list=BRANCHES[route.id], s=list[route.i], n=list.length;
  var top = who(c,'<button class="link" data-action="exit">Back to conversations</button>');
  var steps = stepsHTML(route.i,n,'Screen '+(route.i+1)+' of '+n);
  var remember = route.i===0 ? '<p class="remember">'+esc(TEXT.remember)+'</p>' : '';
  var body;
  if(s.type==='kl'){
    if(S.done.indexOf(route.id)<0){ S.done.push(route.id); save(); say(c.name+' conversation completed.'); }
    body = sceneHTML(s)+klHTML(s.kl)+
      '<div class="actions page-actions"><button class="btn" data-action="exit">Back to conversations</button></div>';
    setView(top+steps+body);
    var k=app.querySelector('.kl h2'); if(k){k.setAttribute('data-focus','');k.setAttribute('tabindex','-1');k.focus({preventScroll:true});}
    return;
  }
  dec = {screen:s, mode:'q', key:'b:'+route.id+':'+route.i, tried:[], solved:false, pick:null, msg:null};
  setView(top+steps+remember+sceneHTML(s)+'<div id="dec">'+decisionInner()+'</div>');
  // focus the scene so screen readers read the situation first
  var sc=app.querySelector('.scene'); if(sc){sc.setAttribute('tabindex','-1'); sc.focus({preventScroll:true});}
}

/* ---- Quiz ---- */
function renderQuiz(){
  quiz = {sel:{}, checked:false, attempts:0, correct:false};
  drawQuiz(true);
}
function drawQuiz(initial){
  var items = QUIZ.items.map(function(it,i){
    var on=!!quiz.sel[i], cls='chk', tag='';
    if(quiz.checked){
      if(it[1]&&on){cls+=' good';tag='Correct'}
      else if(!it[1]&&on){cls+=' bad';tag='Does not apply'}
      else if(it[1]&&!on){cls+=' miss';tag='You missed this one'}
    }
    return '<li><label class="'+cls+'"><input type="checkbox" data-i="'+i+'"'+(on?' checked':'')+(quiz.checked?' disabled':'')+'>'+
      '<span>'+esc(it[0])+(tag?'<span class="tag">'+tag+'</span>':'')+'</span></label></li>';
  }).join('');
  var result='', actions='';
  if(quiz.checked){
    result='<div class="fb '+(quiz.correct?'good':'bad')+'" id="fb" tabindex="-1" role="status"><h3>'+(quiz.correct?'Correct':'Not quite')+'</h3><p>'+esc(quiz.correct?QUIZ.passMsg:QUIZ.failMsg)+'</p></div>';
    actions = quiz.correct
      ? '<button class="btn" data-action="tofb">Continue</button>'
      : '<button class="btn" data-action="qretry">Try again</button>';
  } else {
    var any=Object.keys(quiz.sel).some(function(k){return quiz.sel[k]});
    actions='<button class="btn" data-action="qcheck"'+(any?'':' disabled')+'>Check answers</button>';
  }
  var html = '<h1 data-focus>'+esc(QUIZ.title)+'</h1><p style="margin-top:.6em">'+esc(QUIZ.intro)+'</p>'+
    '<fieldset><legend>'+esc(QUIZ.q)+' <span style="font-weight:400;color:#4d4f53">'+esc(QUIZ.hint)+'</span></legend>'+
    '<ul class="opts" id="qlist">'+items+'</ul></fieldset>'+result+'<div class="actions page-actions">'+actions+'</div>';
  if(initial){ setView(html); }
  else {
    app.innerHTML=html;
    var f=document.getElementById('fb'); if(f){f.focus({preventScroll:true});f.scrollIntoView({block:'nearest'});}
  }
}

/* ---- Simple text pages ---- */
function renderText(o, nextAction, btn, asPanel){
  var h = asPanel
    ? '<div class="panel on-blue"><h1 data-focus style="color:#fff">'+esc(o.title)+'</h1>'+o.paras.map(function(p){return '<p>'+T(p)+'</p>'}).join('')+'</div>'
    : '<h1 data-focus>'+esc(o.title)+'</h1><div style="margin-top:.8em">'+o.paras.map(function(p){return '<p>'+T(p)+'</p>'}).join('')+'</div>';
  h += '<div class="actions page-actions"><button class="btn" data-action="'+nextAction+'">'+esc(btn)+'</button></div>';
  setView(h);
}

/* ---- Continuations ---- */
function renderCont(){
  var C=CONT[route.k], c=charById(C.char), total=C.screens.length+2, i=route.i;
  var top = who(c,'<span class="who-meta" style="font-weight:700;color:#004d8c">'+esc(C.label)+'</span>');
  var steps = stepsHTML(i,total,'Screen '+(i+1)+' of '+total);
  if(i===0){
    setView(top+steps+'<div class="recap"><h1 data-focus style="font-size:1.5rem">Where you left it</h1><p style="margin-top:.5em">'+T(C.recap)+'</p></div>'+
      '<div class="actions"><button class="btn" data-action="next">Begin</button></div>');
    return;
  }
  if(i===total-1){
    setView(top+steps+klHTML(C.kl).replace('<h2>','<h2 data-focus>')+
      '<div class="actions page-actions"><button class="btn" data-action="next">Continue</button></div>');
    return;
  }
  var s=C.screens[i-1];
  dec={screen:s, mode:'cq', key:'c:'+route.k+':'+i, tried:[], solved:false, pick:null, msg:null};
  setView(top+steps+sceneHTML(s)+'<div id="dec">'+decisionInner()+'</div>');
  var sc=app.querySelector('.scene'); if(sc){sc.setAttribute('tabindex','-1'); sc.focus({preventScroll:true});}
}

/* ---- End ---- */
function renderEnd(){
  if(!S.complete){
    S.complete=true; save();
    Scorm.complete(CONFIG.REPORT_SCORE ? scorePct() : undefined);
    say('Activity complete.');
  }
  setView('<div class="panel on-blue"><h1 data-focus style="color:#fff">'+esc(END.title)+'</h1>'+
    END.paras.map(function(p){return '<p>'+T(p)+'</p>'}).join('')+'</div>'+
    '<p class="page-actions" style="font-weight:700;color:#004d8c">'+esc(END.done)+'</p>'+
    '<div class="actions"><button class="btn alt" data-action="restart">Review the conversations again</button></div>');
}

function render(){
  switch(route.stage){
    case 'hub': renderHub(); break;
    case 'b': renderBranch(); break;
    case 'quiz': renderQuiz(); break;
    case 'fb': renderText(FEEDBACK,'tonext','Continue'); break;
    case 'next': renderText(NEXT,'toc1','Continue',true); break;
    case 'c': renderCont(); break;
    case 'end': renderEnd(); break;
    default: renderHub();
  }
}
function go(r){ route=r; render(); save(); }

/* =====================================================================
   EVENTS
   ===================================================================== */
app.addEventListener('change', function(e){
  var el=e.target;
  if(el.matches && el.matches('#qlist input[type=checkbox]')){
    quiz.sel[el.getAttribute('data-i')] = el.checked;
    var any=Object.keys(quiz.sel).some(function(k){return quiz.sel[k]});
    var b=app.querySelector('[data-action=qcheck]'); if(b) b.disabled=!any;
  }
});

app.addEventListener('click', function(e){
  var b=e.target.closest('[data-action]'); if(!b || b.disabled) return;
  var a=b.getAttribute('data-action');

  if(a==='open'){ go({stage:'b', id:b.getAttribute('data-id'), i:0}); }
  else if(a==='exit'){ go({stage:'hub'}); }
  else if(a==='toquiz'){ go({stage:'quiz'}); }
  else if(a==='tofb'){ go({stage:'fb'}); }
  else if(a==='tonext'){ go({stage:'next'}); }
  else if(a==='toc1'){ go({stage:'c', k:'c1', i:0}); }
  else if(a==='restart'){ go({stage:'hub'}); }

  else if(a==='qcheck'){
    quiz.attempts++; quiz.checked=true;
    var ok=true; QUIZ.items.forEach(function(it,i){ if(!!it[1]!==!!quiz.sel[i]) ok=false; });
    quiz.correct=ok;
    if(!(('quiz') in S.first)) S.first['quiz']= (ok && quiz.attempts===1) ? 1 : 0;
    drawQuiz(false); save();
  }
  else if(a==='qretry'){ quiz.checked=false; drawQuiz(false); var h=app.querySelector('legend'); if(h){h.setAttribute('tabindex','-1');h.focus();} }

  else if(a==='pick'){
    if(dec.solved) return;
    var i=+b.getAttribute('data-i'), o=dec.screen.opts[i];
    if(dec.mode==='q'){
      dec.pick=i; dec.solved=true;
      S.first[dec.key]= o[1]?1:0;
      dec.msg = o[1] ? {kind:'good',title:'Correct',body:dec.screen.fb} : {kind:'bad',title:'Not the best response',body:dec.screen.fb};
      refreshDecision(true);
    } else {
      if(o[1]){
        dec.pick=i; dec.solved=true;
        if(!(dec.key in S.first)) S.first[dec.key]=1;
        dec.msg = {kind:'good', title:'Correct', body:dec.screen.fb||''};
      } else {
        dec.tried.push(i);
        S.first[dec.key]=0;
        dec.msg = {kind:'bad', title:'What happens', body:o[2]||''};
      }
      refreshDecision(true);
    }
    save();
  }
  else if(a==='retry'){
    dec.msg=null; refreshDecision(false);
    var first=document.querySelector('#dec .opt:not([disabled])'); if(first) first.focus();
  }
  else if(a==='next'){
    if(route.stage==='c'){
      var C=CONT[route.k], total=C.screens.length+2;
      if(route.i < total-1) go({stage:'c', k:route.k, i:route.i+1});
      else if(route.k==='c1') go({stage:'c', k:'c2', i:0});
      else go({stage:'end'});
    } else if(route.stage==='b'){
      go({stage:'b', id:route.id, i:route.i+1});
    }
  }
});

/* =====================================================================
   START
   ===================================================================== */
Scorm.init();
load();
render();
window.addEventListener('pagehide', function(){ Scorm.finish(S.complete); });
window.addEventListener('beforeunload', function(){ Scorm.finish(S.complete); });
})();
</script>
